# Estrae eventi da pagine note con un modello gratuito (FreeLLMAPI), senza passare da Claude.
# Quattro volte al giorno (circa 3:23, 9:23, 15:23, 21:23 ora italiana) e a mano da Actions → «Estrai eventi con FreeLLMAPI» → Run workflow.
# Ogni giro legge le fonti rimaste indietro da più tempo (fino a 60) e lavora 3 pagine alla volta.
# Segreto da creare: FREELLMAPI_KEY. Variabili facoltative: FREELLMAPI_URL, FREELLMAPI_MODEL.
# Il giro SCRIVE solo se il sito si costruisce e i controlli passano (npm run build): altrimenti non salva nulla.
name: Estrai eventi con FreeLLMAPI

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova: mostra cosa troverebbe, senza salvare'
        type: boolean
        default: false
      max:
        description: 'Quante pagine al massimo'
        default: '60'

permissions:
  contents: write

concurrency:
  group: estrai-eventi
  cancel-in-progress: false

jobs:
  estrai:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Decide se partire (impostazioni di ricerca)
        id: decide
        env:
          EVENTO: ${{ github.event_name }}
          ATTIVO: ${{ vars.ATTIVO }}
          ORE: ${{ vars.ORE_FONTI }}
        run: |
          ORE="${ORE:-6}"
          H=$(date -u +%-H)
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$ATTIVO" = "false" ]; then echo "Ricerche programmate sospese (ATTIVO=false)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $((H % ORE)) -ne 0 ]; then echo "Non tocca a questo giro (si parte ogni $ORE ore)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.decide.outputs.run == 'true'
      - name: Estrai gli eventi
        if: steps.decide.outputs.run == 'true'
        env:
          FREELLMAPI_KEY: ${{ secrets.FREELLMAPI_KEY }}
          FREELLMAPI_URL: ${{ vars.FREELLMAPI_URL }}
          FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL }}
          MAX_FONTI: ${{ inputs.max || vars.FONTI_PER_GIRO || '60' }}
          BUDGET_MINUTI: ${{ vars.BUDGET_MINUTI || '100' }}
          CONCORRENZA: '3'
          TZ: Europe/Rome
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            node scripts/estrai-eventi-ia.mjs --prova | tee giro.txt
          else
            node scripts/estrai-eventi-ia.mjs | tee giro.txt
          fi
      - name: Controlla che il sito si costruisca
        if: ${{ steps.decide.outputs.run == 'true' && !inputs.prova }}
        run: npm run build
        env:
          TZ: Europe/Rome
      - name: Salva
        if: ${{ steps.decide.outputs.run == 'true' && !inputs.prova }}
        run: |
          git config user.name "livelocal-bot"
          git config user.email "livelocal-bot@users.noreply.github.com"
          git add src/data/eventi.json ricerca/consegne ricerca/automazione-stato.json ricerca/comuni-progresso.json ricerca/comuni-pagine.json ricerca/comuni-siti.json ricerca/comuni-abitanti.json
          if git diff --cached --quiet; then echo "Niente da salvare."; exit 0; fi
          git commit -m "Estrazione automatica di eventi (FreeLLMAPI): $(date +%F)"
          for i in 1 2 3 4; do
            if ! git pull --rebase origin main; then
              # Conflitto solo su eventi.json: si tiene la versione online e si aggiungono i nostri eventi.
              if node scripts/risolvi-conflitto-eventi.mjs; then
                git add src/data/eventi.json ricerca/comuni-progresso.json ricerca/comuni-pagine.json ricerca/comuni-abitanti.json ricerca/automazione-stato.json
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep $((i * 5)); continue; }
              else
                git rebase --abort; sleep $((i * 5)); continue
              fi
            fi
            git push origin HEAD:main && break
            sleep $((i * 5))
          done
      - name: Riepilogo
        if: ${{ always() && steps.decide.outputs.run == 'true' }}
        run: |
          echo '### Giro di estrazione' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat giro.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "nessun resoconto" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
