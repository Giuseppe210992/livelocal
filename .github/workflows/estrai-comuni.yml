# Cerca e ricontrolla gli eventi dei comuni da 5.000 abitanti in su, con un modello gratuito (FreeLLMAPI), senza passare da Claude.
# Per ogni comune: trova il sito del Comune, la sua pagina «Eventi», legge le schede e importa gli eventi che superano i controlli.
# Gira ogni 3 ore e a mano da Actions → «Estrai eventi dei comuni con FreeLLMAPI» → Run workflow.
# Segreto necessario: FREELLMAPI_KEY (lo stesso dell'altra Action). Il segnalibro è ricerca/comuni-progresso.json.
name: Estrai eventi dei comuni con FreeLLMAPI

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova: mostra cosa troverebbe, senza salvare'
        type: boolean
        default: false
      quanti:
        description: 'Quanti comuni in questo giro'
        default: '240'

permissions:
  contents: write

concurrency:
  group: estrai-eventi
  cancel-in-progress: false

jobs:
  estrai:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Decide se partire (impostazioni di ricerca)
        id: decide
        env:
          EVENTO: ${{ github.event_name }}
          ATTIVO: ${{ vars.ATTIVO }}
          ORE: ${{ vars.ORE_COMUNI }}
        run: |
          ORE="${ORE:-3}"
          H=$(date -u +%-H)
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$ATTIVO" = "false" ]; then echo "Ricerche programmate sospese (ATTIVO=false)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $((H % ORE)) -ne 0 ]; then echo "Non tocca a questo giro (si parte ogni $ORE ore)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.decide.outputs.run == 'true'
      - name: Cerca gli eventi dei comuni
        if: steps.decide.outputs.run == 'true'
        env:
          FREELLMAPI_KEY: ${{ secrets.FREELLMAPI_KEY }}
          FREELLMAPI_URL: ${{ vars.FREELLMAPI_URL }}
          FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL }}
          COMUNI_PER_GIRO: ${{ inputs.quanti || vars.COMUNI_PER_GIRO || '240' }}
          BUDGET_MINUTI: ${{ vars.BUDGET_MINUTI || '100' }}
          CONCORRENZA: '3'
          TZ: Europe/Rome
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            node scripts/estrai-eventi-ia.mjs --comuni --prova | tee giro.txt
          else
            node scripts/estrai-eventi-ia.mjs --comuni | tee giro.txt
          fi
      - name: Controlla che il sito si costruisca
        if: ${{ steps.decide.outputs.run == 'true' && !inputs.prova }}
        run: npm run build
        env:
          TZ: Europe/Rome
      - name: Salva
        if: ${{ steps.decide.outputs.run == 'true' && !inputs.prova }}
        run: |
          git config user.name "livelocal-bot"
          git config user.email "livelocal-bot@users.noreply.github.com"
          git add src/data/eventi.json ricerca/consegne ricerca/automazione-stato.json ricerca/comuni-progresso.json ricerca/comuni-pagine.json ricerca/comuni-siti.json ricerca/comuni-abitanti.json
          if git diff --cached --quiet; then echo "Niente da salvare."; exit 0; fi
          git commit -m "Estrazione automatica dei comuni (FreeLLMAPI): $(date +%F-%H%M)"
          for i in 1 2 3 4; do
            if ! git pull --rebase origin main; then
              if node scripts/risolvi-conflitto-eventi.mjs; then
                git add src/data/eventi.json ricerca/comuni-progresso.json ricerca/comuni-pagine.json ricerca/comuni-abitanti.json ricerca/automazione-stato.json
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep $((i * 5)); continue; }
              else
                git rebase --abort; sleep $((i * 5)); continue
              fi
            fi
            git push origin HEAD:main && break
            sleep $((i * 5))
          done
      - name: Riepilogo
        if: ${{ always() && steps.decide.outputs.run == 'true' }}
        run: |
          echo '### Giro dei comuni' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 giro.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "nessun resoconto" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
