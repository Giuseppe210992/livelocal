# Legge i siti ufficiali dei luoghi da visitare (musei, aree archeologiche, castelli, palazzi) con un modello gratuito (FreeLLMAPI), senza passare da Claude.
# 1) una volta al mese elenca da Wikidata i luoghi italiani con sito ufficiale (ricerca/luoghi-elenco.json) e da OpenStreetMap i luoghi storici minori (ricerca/luoghi-osm.json, solo per la mappa);
# 2) a ogni giro legge i siti dei luoghi da controllare, estrae orari e costi con citazione delle parole esatte della pagina e scrive la scheda
#    in src/data/luoghi-da-visitare.json SOLO se i controlli passano e il sito si costruisce senza errori. Un luogo senza orari ufficiali non si pubblica.
# Ogni luogo si ricontrolla dopo 30 giorni. Impostazioni modificabili dalla chat: ORE_LUOGHI (ogni quante ore), LUOGHI_PER_GIRO (quanti luoghi).
# 3) i luoghi più noti dei paesi europei da Wikidata (ricerca/luoghi-europa.json), a tappe di 40 minuti per giro, solo per la mappa.
# Segreto: FREELLMAPI_KEY (già presente). A mano da Actions → «Estrai luoghi da visitare con FreeLLMAPI» → Run workflow.
name: Estrai luoghi da visitare con FreeLLMAPI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova: mostra cosa troverebbe, senza salvare'
        type: boolean
        default: false
      quanti:
        description: 'Quanti luoghi in questo giro'
        default: '60'
      riscopri:
        description: 'Rifai subito l''elenco dei luoghi da Wikidata'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: estrai-eventi
  cancel-in-progress: false

jobs:
  estrai:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Decide se partire (impostazioni di ricerca)
        id: decide
        env:
          EVENTO: ${{ github.event_name }}
          ATTIVO: ${{ vars.ATTIVO }}
          ORE: ${{ vars.ORE_LUOGHI }}
        run: |
          ORE="${ORE:-6}"
          H=$(date -u +%-H)
          if [ "$EVENTO" = "schedule" ]; then
            if [ "$ATTIVO" = "false" ]; then echo "Ricerche programmate sospese (ATTIVO=false)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ $((H % ORE)) -ne 1 ] && [ "$ORE" != "1" ]; then echo "Non tocca a questo giro (si parte ogni $ORE ore)."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.decide.outputs.run == 'true'
      - name: Elenca i luoghi da Wikidata (solo se l'elenco manca o ha più di 30 giorni)
        if: steps.decide.outputs.run == 'true'
        timeout-minutes: 40
        continue-on-error: true
        env:
          FORZA: ${{ inputs.riscopri && '1' || '' }}
        run: node scripts/scopri-luoghi.mjs | tee scopri.txt
      - name: Elenca i luoghi minori da OpenStreetMap (solo se l'elenco manca o ha più di 45 giorni)
        if: steps.decide.outputs.run == 'true'
        timeout-minutes: 110
        continue-on-error: true
        env:
          FORZA: ${{ inputs.riscopri && '1' || '' }}
        run: node scripts/scopri-luoghi-osm.mjs | tee scopri-osm.txt
      - name: Elenca i luoghi d'Europa da Wikidata (a tappe: riprende da dove era arrivato)
        if: steps.decide.outputs.run == 'true'
        timeout-minutes: 60
        continue-on-error: true
        env:
          FORZA: ${{ inputs.riscopri && '1' || '' }}
          BUDGET_MINUTI: '40'
        run: node scripts/scopri-luoghi-europa.mjs | tee scopri-europa.txt
      - name: Leggi i siti ufficiali ed estrai orari e costi
        if: steps.decide.outputs.run == 'true'
        env:
          FREELLMAPI_KEY: ${{ secrets.FREELLMAPI_KEY }}
          FREELLMAPI_URL: ${{ vars.FREELLMAPI_URL }}
          FREELLMAPI_MODEL: ${{ vars.FREELLMAPI_MODEL }}
          LUOGHI_PER_GIRO: ${{ inputs.quanti || vars.LUOGHI_PER_GIRO || '60' }}
          BUDGET_MINUTI: ${{ vars.BUDGET_MINUTI || '100' }}
          CONCORRENZA: '3'
          TZ: Europe/Rome
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            node scripts/estrai-luoghi-ia.mjs --prova | tee giro.txt
          else
            node scripts/estrai-luoghi-ia.mjs | tee giro.txt
          fi
      - name: Controlla che il sito si costruisca
        if: ${{ steps.decide.outputs.run == 'true' && !inputs.prova }}
        run: npm run build
        env:
          TZ: Europe/Rome
      - name: Salva
        if: ${{ steps.decide.outputs.run == 'true' && !inputs.prova }}
        run: |
          git config user.name "livelocal-bot"
          git config user.email "livelocal-bot@users.noreply.github.com"
          git add src/data/luoghi-da-visitare.json ricerca/luoghi-elenco.json ricerca/luoghi-osm.json ricerca/luoghi-europa.json ricerca/luoghi-stato.json
          if git diff --cached --quiet; then echo "Niente da salvare."; exit 0; fi
          git commit -m "Luoghi da visitare (FreeLLMAPI): $(date +%F-%H%M)"
          for i in 1 2 3 4; do
            if ! git pull --rebase origin main; then
              if node scripts/risolvi-conflitto-eventi.mjs; then
                git add src/data/luoghi-da-visitare.json ricerca/luoghi-elenco.json ricerca/luoghi-osm.json ricerca/luoghi-europa.json ricerca/luoghi-stato.json
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep $((i * 5)); continue; }
              else
                git rebase --abort; sleep $((i * 5)); continue
              fi
            fi
            git push origin HEAD:main && break
            sleep $((i * 5))
          done
      - name: Riepilogo
        if: ${{ always() && steps.decide.outputs.run == 'true' }}
        run: |
          echo '### Giro dei luoghi da visitare' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 scopri.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -30 scopri-osm.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -30 scopri-europa.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -80 giro.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "nessun resoconto" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
