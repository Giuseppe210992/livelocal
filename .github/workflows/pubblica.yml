# Pubblica il sito su GitHub Pages.
# Parte: a ogni modifica sul branch main, ogni ora (così "oggi", "concluso" e la mappa restano aggiornati)
# e a mano dalla scheda Actions → "Pubblica il sito" → Run workflow.
name: Pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Costruisci il sito e fai i controlli
        run: npm run build
        env:
          # Indirizzo e sottocartella li dà GitHub Pages (es. https://giuseppe210992.github.io + /livelocal).
          # Con un dominio proprio (es. livelocal.it) diventeranno https://livelocal.it e niente sottocartella, da soli.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          TZ: Europe/Rome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      # Avvisa Bing e gli altri motori che usano IndexNow: le pagine nuove entrano nell'indice in poche ore.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avvisa i motori di ricerca (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
        env:
          BASE_SHA: ${{ github.event.before }}
          SITE_URL: https://livelocal.roomandrelax.it
