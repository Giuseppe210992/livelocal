name: Prova lettura di un post pubblico (senza accesso)
# Solo a mano. Verifica cosa restituisce Facebook a un normale lettore, senza login né cookie, per un singolo post pubblico e per una pagina evento.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post e evento pubblici, con un normale browser
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          for U in \
            'https://www.facebook.com/blueturtleNapoli/posts/kind-of-blue-turtle-jammarted%C3%AC-17-novembre-2026-door-2030-music-21301-setandrea-/1498826519009848' \
            'https://www.facebook.com/events/piazza-xx-settembre-5-fano-marche/fiorentina-special-night/985228777997053'; do
            echo "=== $U"
            curl -sS -L -m 30 -A "$UA" -H 'Accept-Language: it-IT,it;q=0.9' -o /tmp/p.html -w 'HTTP %{http_code}, %{size_download} byte, finale: %{url_effective}\n' "$U" || echo "curl fallito"
            for T in 'og:title' 'og:description' 'og:image'; do
              echo "-- $T:"; grep -o "<meta[^>]*property=\"$T\"[^>]*>" /tmp/p.html | head -1 | cut -c1-300
            done
            echo "-- segni di muro di login:"; grep -c -i 'login_form\|checkpoint\|Accedi o iscriviti\|log in or sign up' /tmp/p.html || true
          done
